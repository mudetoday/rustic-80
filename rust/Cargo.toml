[package]
name = "rustic80"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust port of the TIC-80 fantasy computer — core, in progress"
publish = false
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rustic80"
path = "src/main.rs"
required-features = ["lua"]

[features]
default = ["lua"]
lua = ["dep:mlua"]

[dependencies]
mlua = { version = "0.10", optional = true, features = ["lua54", "vendored"] }
png = "0.17"
